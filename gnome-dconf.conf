# load with dconf load /org/gnome/ < gnome-dconf.conf
[Connections]
first-run=false

[Console]
custom-font='MonaspiceAr Nerd Font 10'
use-system-font=false

[Weather]
locations=[<(uint32 2, <('Leipzig', 'EDDP', true, [(0.89739012955151531, 0.21351193934287546)], [(0.89535390627309097, 0.21525726859486979)])>)>]
window-height=495
window-maximized=false
window-width=587

[desktop/a11y]
always-show-universal-access-status=true

[desktop/a11y/applications]
screen-magnifier-enabled=false
screen-reader-enabled=false

[desktop/a11y/magnifier]
cross-hairs-length=58

[desktop/calendar]
week-start-day='monday'

[desktop/datetime]
automatic-timezone=true

[desktop/input-sources]
mru-sources=[('xkb', 'us'), ('xkb', 'de')]
sources=[('xkb', 'us'), ('xkb', 'de')]
xkb-options=@as []

[desktop/interface]
accent-color='slate'
color-scheme='prefer-dark'
cursor-blink=true
cursor-blink-time=1000
cursor-size=24
document-font-name='Noto Sans  10'
enable-animations=true
font-name='Noto Sans  10'
gtk-theme='adw-gtk3-dark'
icon-theme='breeze-dark'
monospace-font-name='Hack  10'
scaling-factor=uint32 1
text-scaling-factor=1.0
toolbar-style='text'
toolkit-accessibility=false

[desktop/privacy]
report-technical-problems=false

[desktop/sound]
event-sounds=false
theme-name='__custom'

[desktop/wm/keybindings]
close=['<Super>q']
maximize=['<Super>f']
minimize=@as []
move-to-monitor-down=['<Super><Shift>Down']
move-to-monitor-left=['<Super><Shift>Left']
move-to-monitor-right=['<Super><Shift>Right']
move-to-monitor-up=['<Super><Shift>Up']
move-to-workspace-down=['<Control><Shift><Alt>Down']
move-to-workspace-left=['<Super><Shift>Page_Up', '<Super><Shift><Alt>Left', '<Control><Shift><Alt>Left']
move-to-workspace-right=['<Super><Shift>Page_Down', '<Super><Shift><Alt>Right', '<Control><Shift><Alt>Right']
move-to-workspace-up=['<Control><Shift><Alt>Up']
switch-applications=@as []
switch-applications-backward=@as []
switch-group=@as []
switch-group-backward=@as []
switch-panels=@as []
switch-panels-backward=@as []
switch-to-workspace-1=@as []
switch-to-workspace-last=@as []
switch-to-workspace-left=@as []
switch-to-workspace-right=@as []
switch-windows=@as []
switch-windows-backward=@as []
unmaximize=@as []

[desktop/wm/preferences]
button-layout='icon:minimize,maximize,close'

[shell]
disable-user-extensions=true
disabled-extensions=['background-logo@fedorahosted.org']
favorite-apps=['foot.desktop', 'librewolf.desktop', 'org.keepassxc.KeePassXC.desktop', 'signal.desktop', 'thunderbird.desktop', 'vlc.desktop']
remember-mount-password=false
welcome-dialog-last-shown-version='48.0'
