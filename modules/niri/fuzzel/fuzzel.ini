# fuzzel.ini — matches foot.ini (black background, white text)
# Location: ~/.config/fuzzel/fuzzel.ini

[main]
font=adwaitamono nerd font mono:size=12
# match your foot terminal font
dpi-aware=no
prompt="❯ "
icon-theme=adwaita
terminal=foot
layer=top
exit-on-keyboard-focus-loss=yes

[colors]
# format: fg rrggbbaa / bg rrggbbaa / (optionally bg-selected-fg for fuzzel ≥1.10)
background=000000f2          # black, slightly translucent (use 000000ff for solid)
text=ffffffff                # white, like foot's foreground
match=ffffffff               # matched substring: keep white (maybe bold)
selection=282828ff           # selected row: dark gray on black (foot has no selection color set, foot default inverts)
selection-text=ffffffff      # white on selection
border=ffffffff              # white border, like text
selection-match=ffffffff

[border]
width=2
radius=0                      # foot is a sharp-cornered terminal — no rounding
